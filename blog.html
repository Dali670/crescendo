<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Crescendo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="page">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Crescendo</a>
  <nav class="menu" aria-label="Navigation principale">
    <a href="index.html">Landing page</a>
    <a href="blog.html" aria-current="page">Blog</a>
    <a href="admin.html" >Espace Admin</a>
  </nav>
</div></header>
<main class="wrap">
<h1 id="t">Blog</h1>
<p class="lead" id="l">Automatisation, IA et architecture de systèmes pour les PME.</p>
<div class="cards" id="list"></div>
<article id="post" hidden></article>
<script type="module">
import { supabase } from "./config.js";
const $ = id => document.getElementById(id);
const fmt = d => d ? new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}) : "";
const slug = new URLSearchParams(location.search).get("p");
if (slug) {
  const { data } = await supabase.from("posts").select("*").eq("slug", slug).maybeSingle();
  $("list").hidden = true; $("l").hidden = true;
  if (!data) { $("t").textContent = "Article introuvable"; }
  else {
    document.title = data.title + " · Crescendo";
    $("t").textContent = data.title;
    const p = $("post"); p.hidden = false;
    const meta = document.createElement("small"); meta.textContent = fmt(data.published_at); p.append(meta);
    data.content.split(/
{2,}/).forEach(t => { const e = document.createElement("p"); e.textContent = t; p.append(e); });
    const back = document.createElement("a"); back.href = "blog.html"; back.textContent = "← Tous les articles"; p.append(back);
  }
} else {
  const { data = [] } = await supabase.from("posts").select("slug,title,excerpt,published_at").eq("published", true).order("published_at", { ascending: false });
  if (!data.length) { $("list").innerHTML = "<p>Aucun article pour le moment.</p>"; }
  for (const a of data) {
    const c = document.createElement("article"); c.className = "card";
    const h = document.createElement("h2"), l = document.createElement("a");
    l.href = "blog.html?p=" + encodeURIComponent(a.slug); l.textContent = a.title; l.style.color = "inherit"; h.append(l);
    const p = document.createElement("p"); p.textContent = a.excerpt;
    const s = document.createElement("small"); s.textContent = fmt(a.published_at);
    c.append(h, p, s); $("list").append(c);
  }
}
</script>
</main>
</body>
</html>
